name: "Repo Integrity Manifest Action"
description: "Generates deterministic JSON and Markdown integrity manifests for all files in the repository."

runs:
  using: "composite"
  steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: No dependencies required
      run: echo "No dependencies required"
      shell: bash

    - name: Generate manifest
      run: node generate-manifest.mjs
      shell: bash

    - name: Commit updated manifests
      run: |
        git config user.name "repo-integrity-bot"
        git config user.email "repo-integrity-bot@users.noreply.github.com"

        # Stage the entire governance directory (JSON + Markdown)
        git add .governance/

        # Only commit if there are changes
        if ! git diff --cached --quiet; then
          git commit -m "Update repo integrity manifest"
          git push
        else
          echo "No manifest changes to commit"
        fi
      shell: bash
